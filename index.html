<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MintooSuite Terminal</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0f17">
<style>
:root{--bg:#0b0f17;--card:#121826;--card2:#1a2236;--line:#26324a;--tx:#e8eef7;--mut:#8b98ad;--grn:#2ebd85;--red:#f6465d;--amb:#f0b90b;--blu:#4c9aff;--org:#ff9f43}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.4}
body{padding-bottom:calc(env(safe-area-inset-bottom) + 16px)}
.top{position:sticky;top:0;z-index:20;background:rgba(11,15,23,.96);backdrop-filter:blur(12px);padding:calc(env(safe-area-inset-top) + 10px) 12px 8px;border-bottom:1px solid var(--line)}
.top-in{max-width:560px;margin:0 auto}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-weight:800;font-size:16px}
.sub{font-size:11px;color:var(--mut)}
.btns{display:flex;gap:6px}
.tbtn{background:var(--card2);border:1px solid var(--line);color:var(--tx);padding:8px 11px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer}
.tbtn.win{border-color:var(--blu);color:var(--blu)}
.status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);margin-top:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);flex:none}
.dot.ok{background:var(--grn)}.dot.warn{background:var(--amb)}
.wrap{max-width:560px;margin:0 auto;padding:0 12px}
.winname{font-size:19px;font-weight:800;margin:14px 0 4px}
.winsub{font-size:12px;color:var(--mut);margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.h{font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--mut);text-transform:uppercase;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.big{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.mid{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.up{color:var(--grn)}.dn{color:var(--red)}.mut{color:var(--mut)}.org{color:var(--org)}.blu{color:var(--blu)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}
.pill.long{background:rgba(46,189,133,.16);color:var(--grn)}
.pill.short{background:rgba(246,70,93,.16);color:var(--red)}
.pill.wait{background:rgba(139,152,173,.16);color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.row:last-child{border-bottom:none}
.row.tap{cursor:pointer}
.lvl{font-size:12px;color:var(--mut);margin-top:2px}
.warnbox{background:rgba(240,185,11,.1);border:1px solid rgba(240,185,11,.4);color:var(--amb);border-radius:10px;padding:8px 10px;font-size:12px;margin:6px 0}
.note{font-size:11px;color:var(--mut);margin-top:8px}
.seg{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.chip{background:var(--card2);border:1px solid var(--line);color:var(--mut);padding:7px 12px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer}
.chip.on{color:var(--tx);border-color:var(--blu);background:rgba(76,154,255,.14)}
.btn{background:var(--card2);border:1px solid var(--line);color:var(--tx);padding:11px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;width:100%;margin-bottom:8px;text-align:left;display:flex;justify-content:space-between}
.btn.on{border-color:var(--grn)}.btn.off{border-color:var(--red);color:var(--mut)}
.btn.primary{background:var(--blu);border-color:var(--blu);color:#06101f;justify-content:center}
select,input[type=text]{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:9px;font-size:13px;width:100%}
canvas{width:100%;height:300px;display:block;background:var(--card);border-radius:12px;border:1px solid var(--line)}
a{color:var(--blu);text-decoration:none}
.news a{color:var(--tx);font-weight:600}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:flex-end;z-index:50}
.sheet.open{display:flex}
.sheet-in{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:20px 20px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 14px);max-height:85vh;overflow:auto;border:1px solid var(--line)}
.sheet-t{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 4px;text-align:center;font-size:12px;font-weight:700;cursor:pointer}
.tile.on{border-color:var(--blu);background:rgba(76,154,255,.14)}
.tile .ic{font-size:24px;display:block;margin-bottom:4px}
.topic{background:var(--card2);border-radius:10px;padding:10px;margin-bottom:8px;font-size:13px}
.topic b{display:block;color:var(--org);margin-bottom:3px}
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <div class="top-row">
    <div><div class="brand" id="lblTitle">💎 MintooSuite Terminal</div><div class="sub">Live market terminal • recommendations only</div></div>
    <div class="btns">
      <button class="tbtn win" id="btnWin" data-act="openwin">🗂 WINDOWS</button>
      <button class="tbtn" id="btnMenu" data-act="openmenu">⚙️ MENU</button>
    </div>
  </div>
  <div class="status"><span class="dot" id="dot"></span><span id="statusTxt">Connecting to Binance…</span></div>
</div></div>

<div class="wrap">
  <div class="winname" id="winName"></div>
  <div class="winsub" id="winSub"></div>
  <div id="view"></div>
</div>

<div class="sheet" id="sheetWin"><div class="sheet-in">
  <div class="sheet-t"><span>🗂 Windows</span><button class="tbtn" data-act="closesheets">✕</button></div>
  <div class="tiles" id="tiles"></div>
</div></div>

<div class="sheet" id="sheetMenu"><div class="sheet-in">
  <div class="sheet-t"><span>⚙️ Menu & Settings</span><button class="tbtn" data-act="closesheets">✕</button></div>
  <div class="card">
    <div class="h">Language / اللغة / 语言</div>
    <select id="langSel">
      <option value="en">English (US)</option><option value="ar">العربية (Arabic)</option><option value="zh">中文 (Chinese)</option>
      <option value="ur">اردو (Urdu)</option><option value="de">Deutsch (German)</option><option value="fr">Français (French)</option>
    </select>
    <div class="note">Language changes the title and top buttons only.</div>
  </div>
  <div class="card">
    <div class="row"><span>Version</span><b class="blu">v6.0 live</b></div>
    <div class="row"><span>Data</span><b>Binance Futures (public, live)</b></div>
    <div class="row"><span>Trading</span><b class="up">Recommendations only</b></div>
  </div>
  <button class="btn" data-act="win:help"><span>📖 Help & contact</span><span>›</span></button>
  <button class="btn" data-act="win:alerts"><span>🔔 Alert settings</span><span>›</span></button>
</div></div>
<script>
// ---------- Scan engine: runs inside background workers (or on the main thread as a fallback) ----------
function engineBoot(self) {
    var BASE = 'https://fapi.binance.com';
    function emaSeries(a, n) { var k = 2 / (n + 1), o = [a[0]]; for (var i = 1; i < a.length; i++) { o.push(a[i] * k + o[i - 1] * (1 - k)); } return o; }
    function ema(a, n) { var s = emaSeries(a, n); return s[s.length - 1]; }
    function rsi(a, n) {
        n = n || 14; if (a.length <= n) { return 50; }
        var g = 0, l = 0, i, d;
        for (i = 1; i <= n; i++) { d = a[i] - a[i - 1]; if (d >= 0) { g += d; } else { l -= d; } }
        g /= n; l /= n;
        for (i = n + 1; i < a.length; i++) { d = a[i] - a[i - 1]; g = (g * (n - 1) + Math.max(d, 0)) / n; l = (l * (n - 1) + Math.max(-d, 0)) / n; }
        return l === 0 ? 100 : 100 - 100 / (1 + g / l);
    }
    function atrK(k, n) {
        n = n || 14; var s = 0, c = 0;
        for (var i = Math.max(1, k.length - n); i < k.length; i++) {
            s += Math.max(k[i].h - k[i].l, Math.abs(k[i].h - k[i - 1].c), Math.abs(k[i].l - k[i - 1].c)); c++;
        }
        return c ? s / c : 0;
    }
    function macdHist(c) {
        var e12 = emaSeries(c, 12), e26 = emaSeries(c, 26), m = [], i;
        for (i = 0; i < c.length; i++) { m.push(e12[i] - e26[i]); }
        var sg = emaSeries(m, 9);
        return [m[m.length - 2] - sg[sg.length - 2], m[m.length - 1] - sg[sg.length - 1]];
    }
    function parse(rows) { return rows.map(function (r) { return { t: +r[0], o: +r[1], h: +r[2], l: +r[3], c: +r[4], v: +r[5], qv: +r[7] }; }); }
    function get(path) {
        return fetch(BASE + path, { cache: 'no-store' }).then(function (r) {
            var w = +(r.headers.get('x-mbx-used-weight-1m') || 0);
            if (r.status === 429 || r.status === 418) { var e = new Error('rate'); e.rate = +(r.headers.get('retry-after') || 60); throw e; }
            if (!r.ok) { throw new Error('HTTP ' + r.status); }
            return r.json().then(function (j) { return { j: j, w: w }; });
        });
    }
    function agg10(k5) {
        var out = [], cur = null;
        k5.forEach(function (x) {
            var b = Math.floor(x.t / 600000) * 600000;
            if (!cur || cur.t !== b) { if (cur) { out.push(cur); } cur = { t: b, o: x.o, h: x.h, l: x.l, c: x.c, v: x.v, n: 1 }; }
            else { cur.h = Math.max(cur.h, x.h); cur.l = Math.min(cur.l, x.l); cur.c = x.c; cur.v += x.v; cur.n++; }
        });
        if (cur) { out.push(cur); }
        return out.filter(function (x) { return x.n === 2; });
    }
    function tfAnalyze(k) {
        if (k.length < 40) { return null; }
        var c = k.map(function (x) { return x.c; }), last = k[k.length - 1];
        var e9 = ema(c, 9), e21 = ema(c, 21), e50 = ema(c, Math.min(50, c.length - 1));
        var r = rsi(c, 14), a = atrK(k, 14), mh = macdHist(c);
        var vols = k.slice(-21, -1).map(function (x) { return x.v; });
        var avgv = vols.reduce(function (s, x) { return s + x; }, 0) / (vols.length || 1);
        var vr = avgv ? last.v / avgv : 1;
        var s = (e9 > e21 ? 1 : -1) + (last.c > e50 ? 0.5 : -0.5);
        if (mh[1] > 0 && mh[1] >= mh[0]) { s += 0.5; } else if (mh[1] < 0 && mh[1] <= mh[0]) { s -= 0.5; }
        if (r > 75) { s -= 0.75; } else if (r < 25) { s += 0.75; }
        if (vr > 1.5) { s += (last.c >= last.o ? 0.5 : -0.5); }
        var side = s >= 1.75 ? 'LONG' : s <= -1.75 ? 'SHORT' : 'WAIT', note = '';
        if (r > 80 && side === 'LONG') { side = 'WAIT'; note = 'overbought'; }
        if (r < 20 && side === 'SHORT') { side = 'WAIT'; note = 'oversold'; }
        var body = Math.abs(last.c - last.o);
        return { side: side, score: s, conf: Math.abs(s) >= 2.5 ? 'HIGH' : Math.abs(s) >= 1.75 ? 'MEDIUM' : 'LOW',
                 rsi: r, atr: a, vr: vr, close: last.c, open: last.o, bodyAtr: a ? body / a : 0, bull: last.c >= last.o, t: last.t, note: note };
    }
    function scanSym(sym) {
        return Promise.all([
            get('/fapi/v1/klines?symbol=' + sym + '&interval=3m&limit=50'),
            get('/fapi/v1/klines?symbol=' + sym + '&interval=5m&limit=99'),
            get('/fapi/v1/klines?symbol=' + sym + '&interval=15m&limit=99')
        ]).then(function (r) {
            var k3 = parse(r[0].j).slice(0, -1), k5 = parse(r[1].j).slice(0, -1), k15 = parse(r[2].j).slice(0, -1);
            return { type: 'scan', sym: sym, w: Math.max(r[0].w, r[1].w, r[2].w),
                     tf: { '3m': tfAnalyze(k3), '10m': tfAnalyze(agg10(k5)), '15m': tfAnalyze(k15) } };
        });
    }
    function planSym(sym, chg, kind) {
        return Promise.all([
            get('/fapi/v1/klines?symbol=' + sym + '&interval=1h&limit=120'),
            get('/fapi/v1/klines?symbol=' + sym + '&interval=1d&limit=90')
        ]).then(function (res) {
            var h = parse(res[0].j), d = parse(res[1].j);
            var hc = h.map(function (x) { return x.c; }), dc = d.map(function (x) { return x.c; });
            var price = hc[hc.length - 1];
            var e20 = ema(dc, 20), e50 = ema(dc, 50), rd = rsi(dc, 14);
            var ds = (price > e20 ? 1 : -1) + (e20 > e50 ? 1 : -1);
            if (rd > 72) { ds -= 0.5; } else if (rd < 28) { ds += 0.5; }
            var e9 = ema(hc, 9), e21 = ema(hc, 21), rh = rsi(hc, 14);
            var hs = (e9 > e21 ? 1 : -1) + (price > e21 ? 0.5 : -0.5);
            if (rh > 75) { hs -= 0.75; } else if (rh < 25) { hs += 0.75; }
            var qv = d.slice(-31, -1).map(function (x) { return x.qv; });
            var avg = qv.reduce(function (a, b) { return a + b; }, 0) / (qv.length || 1);
            var last24 = h.slice(-24).reduce(function (a, x) { return a + x.qv; }, 0);
            var vr = avg ? last24 / avg : 1;
            var boost = vr > 1.2 ? 0.5 : vr < 0.7 ? -0.5 : 0;
            var nd = ds >= 1.5 ? 'LONG' : ds <= -1.5 ? 'SHORT' : 'NEUTRAL';
            var dayScore = ds + hs * 0.5 + (ds >= 0 ? boost : -boost);
            var day = dayScore >= 1.5 ? 'LONG' : dayScore <= -1.5 ? 'SHORT' : 'NEUTRAL';
            var fhScore = hs + (hs >= 0 ? boost : -boost);
            var fh = fhScore >= 1.25 ? 'LONG' : fhScore <= -1.25 ? 'SHORT' : 'WAIT';
            var a1 = atrK(h, 14), ad = atrK(d, 14);
            var conf = function (s) { var a = Math.abs(s); var c = a >= 2.5 ? 'HIGH' : a >= 1.5 ? 'MEDIUM' : 'LOW'; return (vr > 10 && c === 'HIGH') ? 'MEDIUM' : c; };
            var ndc = conf(ds), dayc = conf(dayScore), fhc = conf(fhScore), note = '';
            var over = (rd > 80 || chg > 30) ? 'UP' : (rd < 20 || chg < -30) ? 'DOWN' : '';
            if (over === 'UP') {
                note = 'OVEREXTENDED UP: chasing a long is risky, wait for a pullback';
                if (nd === 'LONG') { nd = 'NEUTRAL'; ndc = 'LOW'; } if (day === 'LONG') { day = 'NEUTRAL'; dayc = 'LOW'; } if (fh === 'LONG') { fh = 'WAIT'; fhc = 'LOW'; }
            } else if (over === 'DOWN') {
                note = 'OVEREXTENDED DOWN: chasing a short is risky, wait for a bounce';
                if (nd === 'SHORT') { nd = 'NEUTRAL'; ndc = 'LOW'; } if (day === 'SHORT') { day = 'NEUTRAL'; dayc = 'LOW'; } if (fh === 'SHORT') { fh = 'WAIT'; fhc = 'LOW'; }
            }
            var fSL = Math.min(1.5 * a1, 0.06 * price), dSL = Math.min(ad, 0.12 * price);
            return { type: 'plan', sym: sym, kind: kind, w: Math.max(res[0].w, res[1].w), price: price, chg: chg, rsiH: rh, rsiD: rd, vr: vr, note: note,
                     nextDay: nd, nextDayConf: ndc, day: day, dayConf: dayc, fh: fh, fhConf: fhc,
                     fhSL: fSL, fhTP: 2 * fSL, daySL: dSL, dayTP: 2 * dSL };
        });
    }
    self.onmessage = function (e) {
        var jobs = e.data.jobs, conc = e.data.conc || 5, id = e.data.id, i = 0, maxw = 0, rate = 0, out = [], errs = 0;
        function lane() {
            if (i >= jobs.length || rate) { return Promise.resolve(); }
            var j = jobs[i++];
            var p = j.type === 'plan' ? planSym(j.sym, j.chg, j.kind) : scanSym(j.sym);
            return p.then(function (r) { if (r.w > maxw) { maxw = r.w; } out.push(r); }, function (err) { if (err && err.rate) { rate = err.rate; } else { errs++; } }).then(lane);
        }
        var lanes = []; for (var n = 0; n < conc; n++) { lanes.push(lane()); }
        Promise.all(lanes).then(function () { self.postMessage({ id: id, out: out, maxw: maxw, rate: rate, errs: errs }); });
    };
}
(function () {
'use strict';
var $ = function (id) { return document.getElementById(id); };
function ls(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function lss(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var SYM_OK = /^[A-Z0-9]{2,20}USDT$/, GOLD = 'XAUUSDT', HOUR = 3600000, NW = 5, CONC = 5;

var S = { tick: {}, wsAt: 0, restAt: 0, threads: 'workers', zero: 0,
    scan: { res: {}, at: 0, ms: 0, n: 0, running: false, pause: 0, first: true, maxw: 0, err: 0, next: 0, total: 0 },
    plan: { items: [], at: 0 }, candles: [], seen: {}, notified: {}, news: [], newsAt: 0, newsTried: false,
    mkt: 'gain', scanf: 'all', chart: { sym: ls('mintoosuite_chart', 'BTCUSDT'), tf: '15m', k: [], ws: null, err: '' },
    win: ls('mintoosuite_win', 'overview'), log: [], lang: ls('mintoosuite_lang', 'en'),
    sysPush: ls('mintoosuite_sys_push', 'on') !== 'off', goldPush: ls('mintoosuite_gold_push', 'on') !== 'off',
    cryptoPush: ls('mintoosuite_crypto_push', 'on') !== 'off', a3m: ls('mintoosuite_alert_3m', 'on') !== 'off', aMaster: ls('mintoosuite_alert_master', 'on') !== 'off' };
try { S.log = JSON.parse(ls('mintoosuite_log', '[]')) || []; } catch (e) { S.log = []; }

// ---------- formatting ----------
function fmtP(p) { return p >= 1000 ? p.toFixed(2) : p >= 1 ? p.toFixed(3) : p >= 0.1 ? p.toFixed(4) : p >= 0.001 ? p.toFixed(6) : p.toFixed(8); }
function pct(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function money(v) { return v >= 1e9 ? '$' + (v / 1e9).toFixed(2) + 'B' : v >= 1e6 ? '$' + (v / 1e6).toFixed(1) + 'M' : '$' + Math.round(v / 1e3) + 'K'; }
function hm(ms) { return new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
function hms(ms) { return new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
function fmtT(ms) { var d = new Date(ms), n = new Date(); return d.toDateString() === n.toDateString() ? hm(ms) : d.toLocaleDateString([], { weekday: 'short' }) + ' ' + hm(ms); }
function ago(ms) { var s = Math.max(0, Math.round((Date.now() - ms) / 1000)); return s < 60 ? s + 's ago' : s < 3600 ? Math.round(s / 60) + 'm ago' : s < 86400 ? Math.round(s / 3600) + 'h ago' : Math.round(s / 86400) + 'd ago'; }
function nm(s) { return s.replace(/USDT$/, '') + '/USDT'; }
function cc(v) { return v >= 0 ? 'up' : 'dn'; }
function pill(side) { var c = side === 'LONG' ? 'long' : side === 'SHORT' ? 'short' : 'wait'; return '<span class="pill ' + c + '">' + side + '</span>'; }
function addLog(type, text) { S.log.unshift({ t: Date.now(), type: type, text: text }); if (S.log.length > 150) { S.log.length = 150; } lss('mintoosuite_log', JSON.stringify(S.log)); }

// ---------- notifications (service worker) ----------
function sendPush(title, body) {
    try {
        if ('serviceWorker' in navigator && navigator.serviceWorker.controller) { navigator.serviceWorker.controller.postMessage({ type: 'TRIGGER_PUSH', title: title, body: body }); }
        else if ('Notification' in window && Notification.permission === 'granted' && navigator.serviceWorker) { navigator.serviceWorker.ready.then(function (r) { r.showNotification(title, { body: body, vibrate: [300, 100, 300], requireInteraction: true }); }); }
    } catch (e) {}
}
function alertPush(sym, title, body) {
    if (!S.sysPush) { return; }
    if (sym === GOLD ? !S.goldPush : !S.cryptoPush) { return; }
    sendPush(title, body);
}

// ---------- live prices: WebSocket (1s) with REST fallback ----------
function ingest(a) {
    for (var i = 0; i < a.length; i++) {
        var x = a[i]; if (!SYM_OK.test(x.s)) { continue; }
        var p = +x.c, o = +x.o; if (!p) { continue; }
        S.tick[x.s] = { p: p, o: o, h: +x.h, l: +x.l, q: +x.q, chg: o ? (p - o) / o * 100 : 0 };
    }
}
var wsBack = 1000;
function connectWS() {
    var ws, dead = false;
