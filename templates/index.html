<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <title>MintooSuite - Quantum Sovereign Suite</title>
    <style>
        :root { --bg: #0b0f19; --card-bg: #111827; --border: #1f2937; --accent: #10b981; --text: #f8fafc; --muted: #94a3b8; }
        body { background-color: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 15px; }
        .logo-area h1 { font-size: 18px; margin: 0; color: #38bdf8; letter-spacing: 0.5px; }
        .logo-area span { font-size: 11px; color: var(--muted); text-transform: uppercase; }
        .badge { background: rgba(16, 185, 129, 0.1); color: var(--accent); padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; border: 1px solid rgba(16, 185, 129, 0.2); }
        .grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 15px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); }
        .card h3 { margin-top: 0; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .ticker-val { font-size: 24px; font-weight: bold; color: var(--accent); margin: 5px 0; }
        .ticker-sub { font-size: 12px; color: var(--muted); }
        .chart-box { height: 120px; background: #07090e; border-radius: 6px; display: flex; align-items: flex-end; padding: 10px; gap: 4px; justify-content: space-between; border: 1px solid #161e2e; margin-top: 10px; }
        .bar { width: 12%; background: #3b82f6; border-radius: 2px 2px 0 0; }
        .bar.green { background: #10b981; }
        .bar.red { background: #ef4444; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn { flex: 1; background: #2563eb; color: white; border: none; padding: 12px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; text-align: center; }
        .btn-danger { background: #dc2626; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-area">
            <h1>MintooSuite</h1>
            <span>Awais Mintoo & Co.</span>
        </div>
        <div class="badge">LIVE CLOUD</div>
    </div>
    <div class="grid">
        <div class="card">
            <h3>Exness Gold (XAU/USD) Market Feed</h3>
            <div class="ticker-val">$4,212.50</div>
            <div class="ticker-sub">Status: Weekend Rollover / Pre-Open</div>
            <div class="chart-box">
                <div class="bar red" style="height: 40%;"></div>
                <div class="bar red" style="height: 35%;"></div>
                <div class="bar green" style="height: 55%;"></div>
                <div class="bar green" style="height: 70%;"></div>
                <div class="bar green" style="height: 65%;"></div>
                <div class="bar green" style="height: 85%;"></div>
            </div>
        </div>
        <div class="card">
            <h3>Quantum Sovereign Execution Suite</h3>
            <p style="font-size: 13px; color: var(--muted); margin-bottom: 15px;">Automated risk-managed position management dashboard.</p>
            <div class="btn-group">
                <button class="btn" onclick="alert('Automated Trading Initialized')">Start Trading</button>
                <button class="btn btn-danger" onclick="alert('Positions Secured')">Secure Profit</button>
            </div>
        </div>
    </div>
</body>
</html>
