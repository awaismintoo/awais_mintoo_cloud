name: Build signed Android app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            echo "sdkmanager not found, downloading the command line tools"
            curl -sSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p /tmp/clt "$ANDROID_HOME/cmdline-tools"
            unzip -q /tmp/clt.zip -d /tmp/clt
            mv /tmp/clt/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest" || sudo mv /tmp/clt/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          ls "$ANDROID_HOME" || true

      - name: Install Android SDK 36
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes | "$SM" --licenses > /dev/null) || (yes | sudo -E env "PATH=$PATH" "JAVA_HOME=$JAVA_HOME" "$SM" --licenses > /dev/null) || true
          "$SM" "platforms;android-36" "build-tools;36.0.0" || sudo -E env "PATH=$PATH" "JAVA_HOME=$JAVA_HOME" "$SM" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Put the web app inside the Android app
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/
          cp privacy.html manifest.json icon.svg icon-192.png icon-512.png android/app/src/main/assets/ 2>/dev/null || true

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "KEYSTORE_B64 secret is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build APK and AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android assembleRelease bundleRelease --no-daemon

      - name: Show the signing fingerprint
        run: keytool -printcert -jarfile android/app/build/outputs/apk/release/app-release.apk | head -12

      - uses: actions/upload-artifact@v4
        with:
          name: MintooSuite-signed
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Publish a downloadable release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/bundle/release/app-release.aab --repo "${{ github.repository }}" --title "MintooSuite build ${{ github.run_number }}" --notes "Signed APK (install on your phone) and AAB (upload to Google Play)." --latest
